[project]
name = "raven"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "rich",
    "python-dotenv",
    "psutil",
    "prompt_toolkit",
    "playwright",
    "google-api-python-client",
    "google-auth-httplib2",
    "google-auth-oauthlib",

]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
raven = "raven.cli:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
markers = [
    "live: hits the real OpenRouter API or a real Google account — costs money/quota, needs credentials. Skipped by default.",
]
addopts = "-m 'not live'"
