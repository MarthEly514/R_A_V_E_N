[project]
name = "raven"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "rich",
    "python-dotenv",
    "psutil",
    "prompt_toolkit",
    "playwright",
    "google-api-python-client",
    "google-auth-httplib2",
    "google-auth-oauthlib",

]

[project.scripts]
raven = "raven.cli:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"