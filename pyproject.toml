[project]
name = "raven"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "rich",
    "python-dotenv",
    "psutil",
    "prompt_toolkit",
    "playwright",
    "google-api-python-client",
    "google-auth-httplib2",
    "google-auth-oauthlib",
    "fastapi",
    "uvicorn[standard]",
]

[project.optional-dependencies]
# Push-to-talk voice input. On Linux also needs the system library: sudo apt install libportaudio2
voice = ["sounddevice", "faster-whisper", "numpy"]
dev = ["pytest", "httpx", "numpy"]

[project.scripts]
raven = "raven.cli:main"
raven-server = "raven.server:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["raven", "raven.*"]  # exactly the package: NOT raven_ui/ (the Electron app) or tests/

[tool.pytest.ini_options]
markers = [
    "live: hits the real OpenRouter API or a real Google account — costs money/quota, needs credentials. Skipped by default.",
]
addopts = "-m 'not live'"
