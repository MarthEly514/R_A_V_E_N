name: build-desktop

# Builds the R.A.V.E.N desktop app installers on each OS. Manual (Actions tab ->
# Run workflow) or on a version tag (v*). The app needs the Python package on the
# user's machine (pip install .); it starts `python -m raven.server` itself.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: raven_ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: raven_ui/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Make installers
        run: npm run make
      - uses: actions/upload-artifact@v4
        with:
          name: raven-ui-${{ matrix.os }}
          path: raven_ui/out/make/**
          if-no-files-found: error
